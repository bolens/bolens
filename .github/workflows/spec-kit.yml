name: Spec Kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-security:
    name: Workflow security
    permissions:
      contents: read
    uses: bolens/.github/.github/workflows/reusable-actionlint.yml@3f2e5f3e61c419f3678ea8f472d24562254624c6
    with:
      security-audit: true

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate scripts and metadata
        shell: bash
        run: |
          find .specify/scripts/bash -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n
          find .agents .specify -type f -name '*.json' -print0 |
            xargs -0 -n1 jq empty
          shellcheck .specify/scripts/bash/*.sh
