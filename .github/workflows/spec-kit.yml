name: Spec Kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate scripts and metadata
        shell: bash
        run: |
          find .specify/scripts/bash -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n
          find .agents .specify -type f -name '*.json' -print0 |
            xargs -0 -n1 jq empty
          shellcheck .specify/scripts/bash/*.sh
