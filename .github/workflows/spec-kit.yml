# Pin both workflow references and tooling-ref to the same immutable commit.
name: Spec Kit

on:
  pull_request:
    paths:
      - .agents/skills/speckit-*/**
      - .specify/**
      - .github/workflows/**
      - AGENTS.md
  push:
    branches: [main]
    paths:
      - .agents/skills/speckit-*/**
      - .specify/**
      - .github/workflows/**
      - AGENTS.md
  schedule:
    - cron: "38 10 * * 1"
  workflow_dispatch:
    inputs:
      update:
        description: Check for and propose a Spec Kit update
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  workflow-security:
    if: github.event_name != 'schedule' && !inputs.update
    permissions:
      contents: read
    uses: bolens/.github/.github/workflows/reusable-actionlint.yml@1792f9078e7c8844e4ba86ffb8ed792efdff4c82
    with:
      security-audit: true

  validate:
    if: github.event_name != 'schedule' && !inputs.update
    uses: bolens/.github/.github/workflows/reusable-spec-kit.yml@1792f9078e7c8844e4ba86ffb8ed792efdff4c82
    with:
      tooling-ref: 1792f9078e7c8844e4ba86ffb8ed792efdff4c82

  update:
    if: github.event_name == 'schedule' || inputs.update
    permissions:
      contents: write
      pull-requests: write
    uses: bolens/.github/.github/workflows/reusable-spec-kit-update.yml@1792f9078e7c8844e4ba86ffb8ed792efdff4c82
    with:
      tooling-ref: 1792f9078e7c8844e4ba86ffb8ed792efdff4c82
