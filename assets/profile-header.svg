<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">Michael Bolens, systems builder</title>
  <desc id="description">A compact system status panel for Linux desktops, self-hosted infrastructure, and practical utilities.</desc>
  <style>
    .panel { fill: #0d1117; stroke: #30363d; }
    .rule { stroke: #30363d; }
    .name { fill: #f0f6fc; font: 700 35px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -1px; }
    .label { fill: #8b949e; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.4px; }
    .value { fill: #c9d1d9; font: 500 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .prompt { fill: #58a6ff; }
    .active { fill: #3fb950; }
    @media (prefers-color-scheme: light) {
      .panel { fill: #f6f8fa; stroke: #d0d7de; }
      .rule { stroke: #d0d7de; }
      .name { fill: #1f2328; }
      .label { fill: #59636e; }
      .value { fill: #25292e; }
      .prompt { fill: #0969da; }
      .active { fill: #1a7f37; }
    }
  </style>
  <rect class="panel" x="1" y="1" width="958" height="258" rx="18" />
  <circle cx="28" cy="26" r="5" fill="#f85149" />
  <circle cx="46" cy="26" r="5" fill="#d29922" />
  <circle cx="64" cy="26" r="5" fill="#3fb950" />
  <text class="label" x="480" y="31" text-anchor="middle">MICHAEL@COLORADO</text>
  <line class="rule" x1="22" y1="49" x2="938" y2="49" />

  <text class="name" x="34" y="99"><tspan class="prompt">$</tspan> build useful systems</text>
  <text class="value" x="35" y="132">Linux desktop tools · self-hosted services · gaming utilities</text>

  <line class="rule" x1="34" y1="158" x2="926" y2="158" />
  <text class="label" x="35" y="187">DESKTOP</text>
  <text class="label" x="340" y="187">INFRASTRUCTURE</text>
  <text class="label" x="691" y="187">UTILITIES</text>
  <circle class="active" cx="41" cy="216" r="5" />
  <circle class="active" cx="346" cy="216" r="5" />
  <circle class="active" cx="697" cy="216" r="5" />
  <text class="value" x="56" y="222">Omarchy / Hyprland</text>
  <text class="value" x="361" y="222">Docker / DNS</text>
  <text class="value" x="712" y="222">Rust / Go / TS</text>
</svg>
